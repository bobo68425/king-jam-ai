[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "python -c \"import os,uvicorn; uvicorn.run('app.main:app',host='0.0.0.0',port=int(os.environ.get('PORT',8080)))\""
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
