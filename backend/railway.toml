[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.prod"

[deploy]
startCommand = "gunicorn --bind :$PORT --workers 2 --threads 4 --timeout 120 --keep-alive 5 -k uvicorn.workers.UvicornWorker app.main:app"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
