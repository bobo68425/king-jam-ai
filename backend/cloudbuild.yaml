# =============================================================================
# King Jam AI - Cloud Build 配置
# 用於自動化建構和部署
# =============================================================================

steps:
  # 建立 Docker 映像檔
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.prod'
      # Cache from the previous build's :latest to speed up layer reuse (~30% faster)
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/kingjam-repo/kingjam-api:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/kingjam-repo/kingjam-api:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/kingjam-repo/kingjam-api:latest'
      - '.'

  # 推送映像檔
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/kingjam-repo/kingjam-api'

  # 部署到 Cloud Run (只更新 image，保留現有 env vars 和 Cloud SQL 設定)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kingjam-api'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/kingjam-repo/kingjam-api:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'

# 替換變數
substitutions:
  _REGION: asia-east1

# 映像檔輸出
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/kingjam-repo/kingjam-api:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/kingjam-repo/kingjam-api:latest'

# 選項
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# 標籤
tags:
  - 'kingjam-api'
  - 'production'

# 超時（30 分鐘）
timeout: '1800s'
