# =============================================================================
# King Jam AI - Video Renderer (Remotion) 部署到 Google Cloud Run
# =============================================================================
#
# 觸發條件:
# - push 到 main 分支且 video-engine/ 有變更
# - 手動觸發 (workflow_dispatch)
#
# 需要設定的 GitHub Secrets:
# - GCP_PROJECT_ID: GCP 專案 ID
# - GCP_SA_KEY: 服務帳戶 JSON 金鑰
# - FAL_KEY: fal.ai API Key (用於 AI 影片生成)
# - OPENAI_API_KEY: OpenAI API Key (用於 TTS 配音)
# =============================================================================

name: Deploy Video Renderer to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'video-engine/**'
      - '.github/workflows/deploy-video-renderer.yml'
  
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SERVICE_NAME: kingjam-video-renderer
  REPOSITORY: kingjam-repo

jobs:
  build-and-deploy:
    name: 🎬 Build & Deploy Video Renderer
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: 🐳 Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 🏷️ Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}"
          
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_sha=${IMAGE_BASE}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_latest=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT

      - name: 🔨 Build Docker image
        working-directory: ./video-engine
        run: |
          docker build \
            --tag ${{ steps.meta.outputs.image_sha }} \
            --tag ${{ steps.meta.outputs.image_latest }} \
            .

      - name: 📤 Push to Artifact Registry
        run: |
          docker push ${{ steps.meta.outputs.image_sha }}
          docker push ${{ steps.meta.outputs.image_latest }}

      - name: 🚀 Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ steps.meta.outputs.image_sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --port 8080 \
            --memory 8Gi \
            --cpu 4 \
            --min-instances 1 \
            --max-instances 5 \
            --timeout 300 \
            --concurrency 1 \
            --labels "managed-by=github-actions,commit-sha=${{ steps.meta.outputs.short_sha }}"
          
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format 'value(status.url)')
          
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: ✅ Health check
        run: |
          sleep 10
          
          # 使用 gcloud 身份發送請求（因為 no-allow-unauthenticated）
          TOKEN=$(gcloud auth print-identity-token)
          
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              "${{ steps.deploy.outputs.service_url }}/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Video Renderer health check passed!"
              exit 0
            fi
            
            echo "⏳ Attempt ${i}/5: HTTP ${HTTP_CODE}"
            sleep 8
          done
          
          echo "❌ Health check failed"
          exit 1

      - name: 📋 Summary
        if: always()
        run: |
          echo "========================================"
          echo "🎬 Video Renderer Deployed!"
          echo "📦 Image: ${{ steps.meta.outputs.image_sha }}"
          echo "🌐 URL: ${{ steps.deploy.outputs.service_url }}"
          echo "💾 Memory: 8Gi | CPU: 4"
          echo "🔒 Auth: Required (service-to-service)"
          echo "========================================"
