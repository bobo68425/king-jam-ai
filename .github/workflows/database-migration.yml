# =============================================================================
# King Jam AI - 資料庫遷移 (手動觸發)
# =============================================================================
#
# 使用方式:
# 1. 前往 GitHub Actions
# 2. 選擇 "Database Migration" workflow
# 3. 點擊 "Run workflow"
# 4. 選擇環境和操作
# =============================================================================

name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '目標環境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: '遷移動作'
        required: true
        default: 'upgrade'
        type: choice
        options:
          - upgrade        # 升級到最新版本
          - downgrade      # 回滾一個版本
          - current        # 顯示當前版本
          - history        # 顯示遷移歷史

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1

jobs:
  migrate:
    name: 🗄️ 資料庫遷移
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔐 Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: ☁️ Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          pip install sqlalchemy alembic psycopg2-binary
      
      - name: ☁️ Setup Cloud SQL Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
      
      - name: 🔗 Start Cloud SQL Proxy
        run: |
          echo "Connecting to ${{ env.PROJECT_ID }}:${{ env.REGION }}:kingjam-db on port 5433"
          ./cloud_sql_proxy -instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:kingjam-db=tcp:5433 > cloud_sql_proxy.log 2>&1 &
          sleep 8
          cat cloud_sql_proxy.log
      
      - name: 🗄️ Run Migration
        env:
          _DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          cd backend
          export DATABASE_URL="postgresql://postgres:${_DB_PASS}@localhost:5433/kingjam"
          
          if [ -z "${_DB_PASS}" ]; then
            echo "❌ DB_PASSWORD secret 未設定"
            exit 1
          fi
          
          echo "📌 使用環境: ${{ inputs.environment }}"
          echo "📌 動作: ${{ inputs.action }}"
          
          case "${{ inputs.action }}" in
            upgrade)
              echo "📈 檢查當前資料庫版本..."
              alembic current || echo "⚠️ 無法取得當前版本"
              echo "📈 執行 Alembic 資料庫遷移..."
              alembic upgrade head || { echo "❌ Alembic 遷移失敗"; exit 1; }
              echo "📈 執行附加直接資料庫遷移腳本..."
              python3 scripts/run_direct_migration.py || { echo "❌ 直接遷移腳本失敗"; exit 1; }
              ;;
            current)
              echo "📍 當前資料庫版本:"
              alembic current 2>/dev/null || echo "(alembic 無法讀取版本)"
              ;;
            history)
              echo "📜 遷移歷史:"
              alembic history --verbose 2>/dev/null || echo "(alembic 無法讀取歷史)"
              ;;
            *)
              echo "⚠️ 不支援的動作: ${{ inputs.action }}"
              ;;
          esac
