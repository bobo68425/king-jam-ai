# =============================================================================
# King Jam AI - 資料庫遷移 (手動觸發)
# =============================================================================
#
# 使用方式:
# 1. 前往 GitHub Actions
# 2. 選擇 "Database Migration" workflow
# 3. 點擊 "Run workflow"
# 4. 選擇環境和操作
# =============================================================================

name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '目標環境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: '遷移動作'
        required: true
        default: 'upgrade'
        type: choice
        options:
          - upgrade        # 升級到最新版本
          - downgrade      # 回滾一個版本
          - current        # 顯示當前版本
          - history        # 顯示遷移歷史

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1

jobs:
  migrate:
    name: 🗄️ 資料庫遷移
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔐 Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: ☁️ Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          pip install sqlalchemy alembic psycopg2-binary
      
      - name: ☁️ Setup Cloud SQL Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
      
      - name: 🔗 Start Cloud SQL Proxy
        run: |
          echo "Connecting to ${{ env.PROJECT_ID }}:${{ env.REGION }}:kingjam-db"
          ./cloud_sql_proxy -instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:kingjam-db=tcp:5432 &
          sleep 8
      
      - name: 🗄️ Run Migration
        env:
          DATABASE_URL: "postgresql://kingjam:${{ secrets.DB_PASSWORD }}@localhost:5432/kingjam_db"
        run: |
          cd backend
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then echo "❌ DB_PASSWORD secret 未設定，請在 GitHub Environments 中設定"; exit 1; fi
          echo "📌 使用環境: ${{ inputs.environment }}"
          
          case "${{ inputs.action }}" in
            upgrade)
              echo "📈 升級資料庫..."
              HEADS=$(alembic heads 2>/dev/null | wc -l) || true
              if [ "${HEADS:-0}" -gt 1 ]; then
                echo "⚠️ 偵測到多個 Alembic heads，執行直接 SQL 遷移..."
                python3 -c "
import os
import sys
dsn = os.environ.get('DATABASE_URL')
if not dsn:
    print('❌ DATABASE_URL 未設定', file=sys.stderr)
    sys.exit(1)
from sqlalchemy import create_engine, text
engine = create_engine(dsn)
try:
    with engine.connect() as conn:
        # NewebPay 欄位
        conn.execute(text('''
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'newebpay_merchant_order_no') THEN
                    ALTER TABLE orders ADD COLUMN newebpay_merchant_order_no VARCHAR(30);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'newebpay_trade_no') THEN
                    ALTER TABLE orders ADD COLUMN newebpay_trade_no VARCHAR(30);
                END IF;
            END \$\$;
        '''))
        conn.commit()
        # 訂閱方案年繳欄位（僅當表存在時）
        conn.execute(text('''
            DO \$\$
            BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'subscription_plans') THEN
                    IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'subscription_plans' AND column_name = 'price_yearly') THEN
                        ALTER TABLE subscription_plans ADD COLUMN price_yearly NUMERIC(10, 2);
                    END IF;
                    IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'subscription_plans' AND column_name = 'yearly_discount_percent') THEN
                        ALTER TABLE subscription_plans ADD COLUMN yearly_discount_percent NUMERIC(5, 2);
                    END IF;
                END IF;
            END \$\$;
        '''))
        conn.commit()
        # 僅當表存在且已有 price_monthly 時更新年繳預設值
        conn.execute(text('''
            DO \$\$
            BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'subscription_plans') THEN
                    UPDATE subscription_plans
                    SET price_yearly = ROUND(price_monthly * 12 * 0.8, 0), yearly_discount_percent = 20
                    WHERE plan_code IN ('basic', 'pro', 'enterprise') AND (price_yearly IS NULL OR yearly_discount_percent IS NULL);
                END IF;
            END \$\$;
        '''))
        conn.commit()
    print('✅ SQL 遷移完成')
except Exception as e:
    print(f'❌ 遷移失敗: {e}', file=sys.stderr)
    sys.exit(1)
"
              else
                alembic upgrade head
              fi
              ;;
            downgrade)
              echo "📉 回滾資料庫一個版本..."
              alembic downgrade -1
              ;;
            current)
              echo "📍 當前資料庫版本:"
              alembic current
              ;;
            history)
              echo "📜 遷移歷史:"
              alembic history --verbose
              ;;
          esac
      
      - name: ✅ Verify
        if: inputs.action == 'upgrade' || inputs.action == 'downgrade'
        run: |
          cd backend
          export DATABASE_URL="postgresql://kingjam:${{ secrets.DB_PASSWORD }}@localhost:5432/kingjam_db"
          echo "📍 當前版本:"
          alembic current
