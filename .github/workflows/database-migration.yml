# =============================================================================
# King Jam AI - 資料庫遷移（手動觸發）
# =============================================================================
# 需於 GitHub → Settings → Secrets → Actions 設定：
#   DATABASE_URL  — 可連線之 Postgres（例如 Railway 提供之連線字串）
# 已不再使用 Cloud SQL Proxy / GCP_SA_KEY。
# =============================================================================

name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "目標環境（對應 GitHub Environment，可設定核准規則）"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production
      action:
        description: "遷移動作"
        required: true
        default: "upgrade"
        type: choice
        options:
          - upgrade
          - current
          - history
          - stamp
      revision:
        description: "目標版本（僅 stamp 用）"
        required: false
        default: "head"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: 🗄️ 資料庫遷移
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: pip install sqlalchemy alembic psycopg2-binary

      - name: 🗄️ Run Alembic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "❌ 請在 Repository secrets 設定 DATABASE_URL（託管 Postgres 連線字串）"
            exit 1
          fi
          cd backend
          echo "📌 動作: ${{ inputs.action }}"
          case "${{ inputs.action }}" in
            upgrade)
              alembic upgrade head
              python3 scripts/run_direct_migration.py
              ;;
            current)
              alembic current || true
              ;;
            history)
              alembic history --verbose || true
              ;;
            stamp)
              alembic stamp "${{ inputs.revision }}"
              ;;
            *)
              echo "不支援的動作"
              exit 1
              ;;
          esac
