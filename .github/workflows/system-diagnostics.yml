
name: 🔍 System Diagnostics

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署環境 (production/staging)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  diagnose:
    name: 🔍 系統健康診斷
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: 📦 Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install redis celery  # 確保診斷工具所需套件存在
          
      - name: 🔬 Run Worker Diagnostics
        run: |
          cd backend
          python3 scripts/debug_worker_system.py
          
      - name: 🗄️ Run Database Diagnostics
        run: |
          cd backend
          python3 scripts/debug_db_state.py
